name: build-linux

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.21.1). Release tag becomes v<version>.'
        required: true
        default: '0.21.1'
      upstream_tag:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          repository: nexu-io/open-design
          ref: ${{ inputs.upstream_tag != '' && inputs.upstream_tag || 'main' }}

      - uses: jdx/mise-action@v2
        with:
          mise_toml: |
            [tools]
            node = "24"
            pnpm = "10.33.2"

      - run: pnpm install --frozen-lockfile
      - run: pnpm tools-pack linux build --to dir --portable --namespace default

      - name: Tar unpacked tree
        run: |
          cd .tmp/tools-pack/out/linux/namespaces/default/builder
          tar -czf open-design-linux-x64.tar.gz linux-unpacked
          sha256sum open-design-linux-x64.tar.gz > open-design-linux-x64.tar.gz.sha256
          cat open-design-linux-x64.tar.gz.sha256

      - name: Publish GH release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: |
            .tmp/tools-pack/out/linux/namespaces/default/builder/open-design-linux-x64.tar.gz
            .tmp/tools-pack/out/linux/namespaces/default/builder/open-design-linux-x64.tar.gz.sha256
